repositories {
    maven {
        name = 'Fuzs'
        url = 'https://raw.githubusercontent.com/Fuzss/modresources/main/maven/'
        content { includeGroup 'fuzs.forgeconfigapiport' }
    }
}

dependencies {
    def configuration = stonecutter.current.version == '1.21.11' ? 'modImplementation' : 'implementation'
    add(configuration, "fuzs.forgeconfigapiport:forgeconfigapiport-fabric:${forge_config_api_port_version}")
}
