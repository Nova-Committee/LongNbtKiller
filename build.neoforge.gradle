plugins {
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version

    runs {
        client {
            client()
        }
        server {
            server()
        }
    }

    mods {
        longnbtkiller {
            sourceSet sourceSets.main
        }
    }
}

apply from: rootProject.file('gradle/mod.gradle')
